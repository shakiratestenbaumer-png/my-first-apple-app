name: Build iOS & watchOS Apps

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-iphone-app:
    name: Build iPhone App
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build iPhone app (Simulator)
        run: |
          xcodebuild build \
            -project MyFirstAppleApp/MyFirstAppleApp.xcodeproj \
            -scheme MyFirstAppleApp \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO | tail -50

      - name: Build iPhone app (Archive for device)
        run: |
          xcodebuild archive \
            -project MyFirstAppleApp/MyFirstAppleApp.xcodeproj \
            -scheme MyFirstAppleApp \
            -destination 'generic/platform=iOS' \
            -archivePath ${{ github.workspace }}/build/MyFirstAppleApp.xcarchive \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" | tail -50

      - name: Create IPA from archive
        run: |
          mkdir -p ${{ github.workspace }}/build/ipa/Payload
          cp -r ${{ github.workspace }}/build/MyFirstAppleApp.xcarchive/Products/Applications/MyFirstAppleApp.app \
            ${{ github.workspace }}/build/ipa/Payload/
          cd ${{ github.workspace }}/build/ipa
          zip -r ${{ github.workspace }}/build/MyFirstAppleApp.ipa Payload

      - name: Upload iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: MyFirstAppleApp-iPhone-IPA
          path: build/MyFirstAppleApp.ipa
          retention-days: 30

      - name: Upload iPhone archive
        uses: actions/upload-artifact@v4
        with:
          name: MyFirstAppleApp-iPhone-Archive
          path: build/MyFirstAppleApp.xcarchive
          retention-days: 30

  build-watch-app:
    name: Build Watch App
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build Watch app (Simulator)
        run: |
          xcodebuild build \
            -project MyFirstAppleApp/MyFirstAppleApp.xcodeproj \
            -scheme MyFirstWatchApp \
            -destination 'platform=watchOS Simulator,name=Apple Watch Series 9 (45mm),OS=latest' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO | tail -50

      - name: Build Watch app (Archive for device)
        run: |
          xcodebuild archive \
            -project MyFirstAppleApp/MyFirstAppleApp.xcodeproj \
            -scheme MyFirstWatchApp \
            -destination 'generic/platform=watchOS' \
            -archivePath ${{ github.workspace }}/build/MyFirstWatchApp.xcarchive \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" | tail -50

      - name: Create Watch IPA from archive
        run: |
          mkdir -p ${{ github.workspace }}/build/watch-ipa/Payload
          cp -r ${{ github.workspace }}/build/MyFirstWatchApp.xcarchive/Products/Applications/MyFirstWatchApp.app \
            ${{ github.workspace }}/build/watch-ipa/Payload/
          cd ${{ github.workspace }}/build/watch-ipa
          zip -r ${{ github.workspace }}/build/MyFirstWatchApp.ipa Payload

      - name: Upload Watch IPA
        uses: actions/upload-artifact@v4
        with:
          name: MyFirstWatchApp-IPA
          path: build/MyFirstWatchApp.ipa
          retention-days: 30

      - name: Upload Watch archive
        uses: actions/upload-artifact@v4
        with:
          name: MyFirstWatchApp-Archive
          path: build/MyFirstWatchApp.xcarchive
          retention-days: 30
